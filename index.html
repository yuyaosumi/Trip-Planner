<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行計画ブック - Trip Planner</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: #eff6ff;
            --secondary: #10b981;
            --secondary-hover: #059669;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 60px;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 20px 16px;
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* Screen Management */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Title Screen / Trip List */
        .title-hero {
            text-align: center;
            margin-bottom: 24px;
        }

        .title-hero h2 {
            font-size: 1.6rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .title-hero p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .action-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        .trip-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .trip-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .trip-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .trip-card-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
            padding-right: 24px;
        }

        .trip-card-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .trip-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
        }

        .trip-card-days {
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 12px;
        }

        .delete-trip-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        .delete-trip-btn:hover {
            color: var(--danger);
            background: #fef2f2;
        }

        /* Trip Detail Elements */
        .trip-header-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .trip-title-input {
            width: 100%;
            font-size: 1.25rem;
            font-weight: bold;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 4px 0;
            outline: none;
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        .trip-title-input:focus {
            border-bottom-color: var(--primary);
        }

        .trip-dates {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .date-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .date-group input[type="date"] {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 8px;
            color: var(--text-main);
            outline: none;
        }

        /* Navigation Tabs */
        .tabs {
            display: flex;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 4px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary-light);
            color: var(--primary);
        }

        /* Section Cards */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Elements */
        .form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .form-control {
            flex: 1;
            min-width: 120px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.85rem;
            border-radius: 6px;
        }

        .btn-danger-light {
            background: #fef2f2;
            color: var(--danger);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-main);
        }

        /* Timeline / Schedule */
        .day-section {
            margin-bottom: 24px;
        }

        .day-header {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
            padding-bottom: 4px;
            border-bottom: 2px solid var(--primary-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timeline {
            position: relative;
            padding-left: 20px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: var(--border-color);
        }

        .timeline-item {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -18px;
            top: 18px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid white;
        }

        .timeline-time {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-muted);
            min-width: 50px;
        }

        .timeline-content {
            flex: 1;
        }

        .timeline-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .timeline-memo {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: pre-wrap;
        }

        .timeline-cost-badge {
            display: inline-block;
            background: #f1f5f9;
            color: var(--text-main);
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            font-weight: 600;
        }

        /* Quick Add & Packing List */
        .quick-add-container {
            margin-bottom: 16px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }

        .quick-add-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .quick-add-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-tag {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-sm);
        }

        .quick-tag input[type="number"] {
            width: 40px;
            padding: 2px 4px;
            font-size: 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            text-align: center;
        }

        .quick-tag-add-btn {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
        }

        .list-group {
            list-style: none;
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .list-item-left input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .list-item-left.checked span {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .badge-count {
            background: #e2e8f0;
            color: #475569;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 600;
        }

        /* Budget / Expenses with Chart */
        .budget-summary {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            background: var(--primary-light);
            padding: 16px;
            border-radius: 8px;
        }

        .budget-box {
            flex: 1;
            text-align: center;
        }

        .budget-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .budget-value {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary);
        }

        .sub-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .sub-tab-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
        }

        .sub-tab-btn.active {
            background: #e2e8f0;
            color: var(--text-main);
        }

        .chart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        #expenseCanvas {
            max-width: 260px;
            max-height: 260px;
            margin-bottom: 16px;
        }

        .chart-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .day-actions {
            display: flex;
            justify-content: center;
            margin-top: 16px;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
            }
            .form-control {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <h1 onclick="showTitleScreen()"><i data-lucide="plane"></i> 旅行計画ブック</h1>
            <button id="backToListBtn" class="back-btn" style="display: none;" onclick="showTitleScreen()">
                <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> 一覧へ戻る
            </button>
        </div>
    </header>

    <div class="container">
        
        <!-- SCREEN 1: TITLE / LIST SCREEN -->
        <div id="screen-title" class="screen active">
            <div class="title-hero">
                <h2>あなたの旅行計画一覧</h2>
                <p>次の旅の準備を始めましょう。新しい計画を作成するか、既存の計画を選択してください。</p>
            </div>

            <div class="action-bar">
                <button class="btn btn-primary" onclick="createNewTrip()">
                    <i data-lucide="plus"></i> ＋ 新しい計画を作成
                </button>
            </div>

            <div class="trip-grid" id="tripGrid"></div>
        </div>

        <!-- SCREEN 2: TRIP DETAIL / EDIT SCREEN -->
        <div id="screen-detail" class="screen">
            <!-- Trip General Info -->
            <div class="trip-header-card">
                <input type="text" id="tripTitle" class="trip-title-input" placeholder="旅行のタイトル（例: 北海道3泊4日の旅）">
                <div class="trip-dates">
                    <div class="date-group">
                        <i data-lucide="calendar"></i> 出発:
                        <input type="date" id="startDate">
                    </div>
                    <div class="date-group">
                        帰宅:
                        <input type="date" id="endDate">
                    </div>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('schedule', event)">
                    <i data-lucide="clock"></i> スケジュール
                </button>
                <button class="tab-btn" onclick="switchTab('packing', event)">
                    <i data-lucide="briefcase"></i> 持ち物
                </button>
                <button class="tab-btn" onclick="switchTab('budget', event)">
                    <i data-lucide="wallet"></i> 費用
                </button>
            </div>

            <!-- TAB 1: SCHEDULE -->
            <div id="tab-schedule" class="tab-content active">
                <div class="card">
                    <div class="card-header">
                        <span class="card-title"><i data-lucide="plus-circle"></i> 予定を追加</span>
                    </div>
                    <div class="form-row">
                        <select id="scheduleDay" class="form-control" style="flex: 0.8;"></select>
                        <input type="time" id="scheduleTime" class="form-control" style="flex: 0.8;" value="09:00">
                        <input type="text" id="scheduleTitle" class="form-control" placeholder="予定・場所（例: 札幌駅集合）" style="flex: 2;">
                    </div>
                    <div class="form-row">
                        <input type="number" id="scheduleCost" class="form-control" placeholder="費用 (任意・1000円単位)" step="1000" min="0" style="flex: 1;">
                        <select id="scheduleCategory" class="form-control" style="flex: 1;">
                            <option value="交通費">交通費</option>
                            <option value="宿泊費">宿泊費</option>
                            <option value="食費" selected>食費</option>
                            <option value="観光・体験">観光・体験</option>
                            <option value="お土産">お土産</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <input type="text" id="scheduleMemo" class="form-control" placeholder="メモ（電車時刻、予約番号など）">
                        <button class="btn btn-primary" onclick="addSchedule()"><i data-lucide="plus"></i> 追加</button>
                    </div>
                </div>

                <!-- Schedule List per Day -->
                <div id="scheduleContainer"></div>

                <div class="day-actions">
                    <button class="btn btn-secondary" onclick="addDay()"><i data-lucide="calendar-plus"></i> ＋ 日程を追加（日数を増やす）</button>
                </div>
            </div>

            <!-- TAB 2: PACKING LIST -->
            <div id="tab-packing" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <span class="card-title"><i data-lucide="check-square"></i> 持ち物管理</span>
                    </div>

                    <div class="quick-add-container">
                        <div class="quick-add-title">よく入れる持ち物をクイック追加：</div>
                        <div class="quick-add-tags" id="quickTags"></div>
                    </div>

                    <div class="form-row">
                        <input type="text" id="packingName" class="form-control" placeholder="持ち物の名前（例: 充電器）" style="flex: 2;">
                        <input type="number" id="packingCount" class="form-control" value="1" min="1" style="flex: 0.8;" placeholder="個数">
                        <button class="btn btn-primary" onclick="addPackingCustom()"><i data-lucide="plus"></i> 追加</button>
                    </div>

                    <ul class="list-group" id="packingList"></ul>
                </div>
            </div>

            <!-- TAB 3: BUDGET & EXPENSES -->
            <div id="tab-budget" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <span class="card-title"><i data-lucide="dollar-sign"></i> 費用の管理</span>
                    </div>

                    <div class="budget-summary">
                        <div class="budget-box">
                            <div class="budget-label">旅程全体の合計費用</div>
                            <div class="budget-value" id="totalBudget">¥0</div>
                        </div>
                    </div>

                    <div class="form-row">
                        <input type="text" id="expenseItem" class="form-control" placeholder="項目（例: 航空券、ホテル代）">
                        <input type="number" id="expenseAmount" class="form-control" placeholder="金額 (1000円単位)" step="1000" min="0">
                        <select id="expenseCategory" class="form-control">
                            <option value="交通費">交通費</option>
                            <option value="宿泊費">宿泊費</option>
                            <option value="食費">食費</option>
                            <option value="観光・体験">観光・体験</option>
                            <option value="お土産">お土産</option>
                            <option value="その他">その他</option>
                        </select>
                        <button class="btn btn-primary" onclick="addDirectExpense()"><i data-lucide="plus"></i> 追加</button>
                    </div>

                    <div class="sub-tabs">
                        <button class="sub-tab-btn active" id="btn-view-list" onclick="switchExpenseView('list')"><i data-lucide="list"></i> リスト表示</button>
                        <button class="sub-tab-btn" id="btn-view-chart" onclick="switchExpenseView('chart')"><i data-lucide="pie-chart"></i> 円グラフ</button>
                    </div>

                    <div id="expenseViewList">
                        <ul class="list-group" id="expenseList"></ul>
                    </div>

                    <div id="expenseViewChart" style="display: none;" class="chart-container">
                        <canvas id="expenseCanvas" width="260" height="260"></canvas>
                        <div class="chart-legend" id="chartLegend"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Multi-trip Storage Management
        let trips = [];
        let currentTripId = null;

        const defaultQuickItems = [
            { name: "着替え", defaultCount: 3 },
            { name: "歯ブラシ", defaultCount: 1 },
            { name: "充電器", defaultCount: 1 },
            { name: "モバイルバッテリー", defaultCount: 1 },
            { name: "常備薬", defaultCount: 1 },
            { name: "雨具/折りたたみ傘", defaultCount: 1 },
            { name: "パジャマ", defaultCount: 1 }
        ];

        const categoryColors = {
            "交通費": "#3b82f6",
            "宿泊費": "#10b981",
            "食費": "#f59e0b",
            "観光・体験": "#8b5cf6",
            "お土産": "#ec4899",
            "その他": "#64748b"
        };

        document.addEventListener("DOMContentLoaded", () => {
            loadAllTrips();
            setupEventListeners();
            showTitleScreen();
            lucide.createIcons();
        });

        function setupEventListeners() {
            document.getElementById('tripTitle').addEventListener('input', (e) => {
                const trip = getCurrentTrip();
                if (trip) {
                    trip.tripTitle = e.target.value;
                    saveAllTrips();
                }
            });
            document.getElementById('startDate').addEventListener('change', (e) => {
                const trip = getCurrentTrip();
                if (trip) {
                    trip.startDate = e.target.value;
                    saveAllTrips();
                }
            });
            document.getElementById('endDate').addEventListener('change', (e) => {
                const trip = getCurrentTrip();
                if (trip) {
                    trip.endDate = e.target.value;
                    saveAllTrips();
                }
            });
        }

        // Navigation Management
        function showTitleScreen() {
            currentTripId = null;
            document.getElementById('screen-title').classList.add('active');
            document.getElementById('screen-detail').classList.remove('active');
            document.getElementById('backToListBtn').style.display = 'none';
            renderTripGrid();
        }

        function showDetailScreen(tripId) {
            currentTripId = tripId;
            document.getElementById('screen-title').classList.remove('active');
            document.getElementById('screen-detail').classList.add('active');
            document.getElementById('backToListBtn').style.display = 'flex';

            const trip = getCurrentTrip();
            if (trip) {
                document.getElementById('tripTitle').value = trip.tripTitle || "";
                document.getElementById('startDate').value = trip.startDate || "";
                document.getElementById('endDate').value = trip.endDate || "";
                switchTab('schedule');
                renderAll();
            }
        }

        function getCurrentTrip() {
            return trips.find(t => t.id === currentTripId);
        }

        // Trip Collection Operations
        function createNewTrip() {
            const newTrip = {
                id: Date.now(),
                tripTitle: "新しい旅行計画",
                startDate: new Date().toISOString().split('T')[0],
                endDate: new Date().toISOString().split('T')[0],
                daysCount: 3,
                schedules: [],
                packings: [],
                directExpenses: []
            };

            trips.unshift(newTrip);
            saveAllTrips();
            showDetailScreen(newTrip.id);
        }

        function deleteTrip(tripId, evt) {
            if (evt) evt.stopPropagation();
            if (!confirm("この旅行計画を削除してもよろしいですか？")) return;

            trips = trips.filter(t => t.id !== tripId);
            saveAllTrips();
            renderTripGrid();
        }

        function renderTripGrid() {
            const grid = document.getElementById('tripGrid');
            grid.innerHTML = '';

            if (trips.length === 0) {
                grid.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">保存された旅行計画がありません。「＋ 新しい計画を作成」から作成してみましょう！</div>`;
                return;
            }

            trips.forEach(trip => {
                const card = document.createElement('div');
                card.className = 'trip-card';
                card.onclick = () => showDetailScreen(trip.id);

                const dateText = (trip.startDate || trip.endDate) 
                    ? `${trip.startDate || ''} 〜 ${trip.endDate || ''}`
                    : '日程未定';

                card.innerHTML = `
                    <button class="delete-trip-btn" onclick="deleteTrip(${trip.id}, event)" title="計画を削除">
                        <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
                    </button>
                    <div>
                        <div class="trip-card-title">${escapeHtml(trip.tripTitle || '無題の旅行')}</div>
                        <div class="trip-card-date">
                            <i data-lucide="calendar" style="width:14px;height:14px;"></i> ${dateText}
                        </div>
                    </div>
                    <div class="trip-card-footer">
                        <span class="trip-card-days">${trip.daysCount || 1}日間</span>
                        <span style="font-size:0.85rem; color:var(--primary); font-weight:600;">編集する →</span>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        // Tab Switching
        function switchTab(tabName, evt) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (evt) {
                evt.currentTarget.classList.add('active');
            } else {
                const defaultBtn = document.querySelector(`.tab-btn[onclick*="'${tabName}'"]`);
                if (defaultBtn) defaultBtn.classList.add('active');
            }
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            if (tabName === 'budget') {
                renderExpenses();
            }
        }

        function switchExpenseView(viewType) {
            const listBtn = document.getElementById('btn-view-list');
            const chartBtn = document.getElementById('btn-view-chart');
            const listView = document.getElementById('expenseViewList');
            const chartView = document.getElementById('expenseViewChart');

            if (viewType === 'list') {
                listBtn.classList.add('active');
                chartBtn.classList.remove('active');
                listView.style.display = 'block';
                chartView.style.display = 'none';
            } else {
                chartBtn.classList.add('active');
                listBtn.classList.remove('active');
                listView.style.display = 'none';
                chartView.style.display = 'flex';
                drawExpenseChart();
            }
        }

        // Render Functions
        function renderAll() {
            updateDaySelectOptions();
            renderSchedule();
            renderQuickTags();
            renderPacking();
            renderExpenses();
        }

        function updateDaySelectOptions() {
            const trip = getCurrentTrip();
            if (!trip) return;

            const select = document.getElementById('scheduleDay');
            select.innerHTML = '';
            for (let i = 1; i <= trip.daysCount; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${i}日目`;
                select.appendChild(opt);
            }
        }

        // Days Operations
        function addDay() {
            const trip = getCurrentTrip();
            if (!trip) return;

            trip.daysCount += 1;
            saveAllTrips();
            renderAll();
        }

        function deleteDay(dayNum) {
            const trip = getCurrentTrip();
            if (!trip) return;

            if (trip.daysCount <= 1) {
                alert("最低1日は必要です。");
                return;
            }
            if (!confirm(`${dayNum}日目を削除してもよろしいですか？（この日の予定も削除されます）`)) return;

            trip.schedules = trip.schedules.filter(s => s.day !== dayNum);
            
            trip.schedules.forEach(s => {
                if (s.day > dayNum) {
                    s.day -= 1;
                }
            });

            trip.daysCount -= 1;
            saveAllTrips();
            renderAll();
        }

        // Schedule Logic
        function renderSchedule() {
            const trip = getCurrentTrip();
            if (!trip) return;

            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';

            for (let day = 1; day <= trip.daysCount; day++) {
                const dayItems = (trip.schedules || [])
                    .filter(s => s.day === day)
                    .sort((a, b) => a.time.localeCompare(b.time));

                const daySection = document.createElement('div');
                daySection.className = 'day-section';
                
                let itemsHTML = '';
                if (dayItems.length === 0) {
                    itemsHTML = `<div class="empty-state">予定が登録されていません</div>`;
                } else {
                    itemsHTML = `<div class="timeline">` + dayItems.map(item => `
                        <div class="timeline-item">
                            <div class="timeline-time">${item.time}</div>
                            <div class="timeline-content">
                                <div class="timeline-title">${escapeHtml(item.title)}</div>
                                ${item.memo ? `<div class="timeline-memo">${escapeHtml(item.memo)}</div>` : ''}
                                ${item.cost ? `<span class="timeline-cost-badge">費用: ¥${item.cost.toLocaleString()} (${item.category || 'その他'})</span>` : ''}
                            </div>
                            <button class="btn btn-sm btn-danger-light" onclick="deleteSchedule(${item.id})">
                                <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
                            </button>
                        </div>
                    `).join('') + `</div>`;
                }

                daySection.innerHTML = `
                    <div class="day-header">
                        <span><i data-lucide="calendar"></i> ${day}日目</span>
                        <button class="btn btn-sm btn-danger-light" onclick="deleteDay(${day})">この日を削除</button>
                    </div>
                    ${itemsHTML}
                `;
                container.appendChild(daySection);
            }
            lucide.createIcons();
        }

        function addSchedule() {
            const trip = getCurrentTrip();
            if (!trip) return;

            const day = parseInt(document.getElementById('scheduleDay').value);
            const time = document.getElementById('scheduleTime').value || "00:00";
            const title = document.getElementById('scheduleTitle').value.trim();
            const memo = document.getElementById('scheduleMemo').value.trim();
            const costVal = document.getElementById('scheduleCost').value.trim();
            const cost = costVal ? parseInt(costVal) : 0;
            const category = document.getElementById('scheduleCategory').value;

            if (!title) return alert('予定の名称を入力してください');

            if (!trip.schedules) trip.schedules = [];

            trip.schedules.push({
                id: Date.now(),
                day,
                time,
                title,
                memo,
                cost,
                category
            });

            document.getElementById('scheduleTitle').value = '';
            document.getElementById('scheduleMemo').value = '';
            document.getElementById('scheduleCost').value = '';
            
            saveAllTrips();
            renderSchedule();
        }

        function deleteSchedule(id) {
            const trip = getCurrentTrip();
            if (!trip) return;

            trip.schedules = trip.schedules.filter(s => s.id !== id);
            saveAllTrips();
            renderSchedule();
        }

        // Packing Logic
        function renderQuickTags() {
            const container = document.getElementById('quickTags');
            container.innerHTML = defaultQuickItems.map((item, idx) => `
                <div class="quick-tag">
                    <span>${item.name}</span>
                    <input type="number" id="quick-count-${idx}" value="${item.defaultCount}" min="1">
                    <button class="quick-tag-add-btn" onclick="addQuickPacking('${item.name}', ${idx})">+</button>
                </div>
            `).join('');
        }

        function addQuickPacking(name, idx) {
            const trip = getCurrentTrip();
            if (!trip) return;

            const countInput = document.getElementById(`quick-count-${idx}`);
            const count = parseInt(countInput.value) || 1;

            if (!trip.packings) trip.packings = [];

            trip.packings.push({
                id: Date.now(),
                name: name,
                count: count,
                checked: false
            });

            saveAllTrips();
            renderPacking();
        }

        function addPackingCustom() {
            const trip = getCurrentTrip();
            if (!trip) return;

            const name = document.getElementById('packingName').value.trim();
            const count = parseInt(document.getElementById('packingCount').value) || 1;

            if (!name) return alert('持ち物の名前を入力してください');

            if (!trip.packings) trip.packings = [];

            trip.packings.push({
                id: Date.now(),
                name: name,
                count: count,
                checked: false
            });

            document.getElementById('packingName').value = '';
            document.getElementById('packingCount').value = '1';

            saveAllTrips();
            renderPacking();
        }

        function togglePacking(id) {
            const trip = getCurrentTrip();
            if (!trip) return;

            const item = trip.packings.find(p => p.id === id);
            if (item) {
                item.checked = !item.checked;
                saveAllTrips();
                renderPacking();
            }
        }

        function deletePacking(id) {
            const trip = getCurrentTrip();
            if (!trip) return;

            trip.packings = trip.packings.filter(p => p.id !== id);
            saveAllTrips();
            renderPacking();
        }

        function renderPacking() {
            const trip = getCurrentTrip();
            if (!trip) return;

            const container = document.getElementById('packingList');
            if (!trip.packings || trip.packings.length === 0) {
                container.innerHTML = `<div class="empty-state">持ち物が登録されていません</div>`;
                return;
            }

            container.innerHTML = trip.packings.map(item => `
                <li class="list-item">
                    <div class="list-item-left ${item.checked ? 'checked' : ''}">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="togglePacking(${item.id})">
                        <span>${escapeHtml(item.name)}</span>
                        <span class="badge-count">${item.count}個</span>
                    </div>
                    <button class="btn btn-sm btn-danger-light" onclick="deletePacking(${item.id})">
                        <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
                    </button>
                </li>
            `).join('');
            lucide.createIcons();
        }

        // Expense Logic
        function addDirectExpense() {
            const trip = getCurrentTrip();
            if (!trip) return;

            const name = document.getElementById('expenseItem').value.trim();
            const amount = parseInt(document.getElementById('expenseAmount').value);
            const category = document.getElementById('expenseCategory').value;

            if (!name || isNaN(amount)) return alert('項目名と正しい金額を入力してください');

            if (!trip.directExpenses) trip.directExpenses = [];

            trip.directExpenses.push({
                id: Date.now(),
                name,
                amount,
                category
            });

            document.getElementById('expenseItem').value = '';
            document.getElementById('expenseAmount').value = '';

            saveAllTrips();
            renderExpenses();
        }

        function deleteDirectExpense(id) {
            const trip = getCurrentTrip();
            if (!trip) return;

            trip.directExpenses = trip.directExpenses.filter(e => e.id !== id);
            saveAllTrips();
            renderExpenses();
        }

        function getAllExpenses() {
            const trip = getCurrentTrip();
            if (!trip) return [];

            const list = [];

            if (trip.directExpenses) {
                trip.directExpenses.forEach(e => {
                    list.push({
                        id: e.id,
                        name: e.name,
                        amount: e.amount,
                        category: e.category,
                        type: 'direct'
                    });
                });
            }

            if (trip.schedules) {
                trip.schedules.forEach(s => {
                    if (s.cost && s.cost > 0) {
                        list.push({
                            id: s.id,
                            name: `[${s.day}日目] ${s.title}`,
                            amount: s.cost,
                            category: s.category || 'その他',
                            type: 'schedule'
                        });
                    }
                });
            }

            return list;
        }

        function renderExpenses() {
            const container = document.getElementById('expenseList');
            const allExpenses = getAllExpenses();
            const total = allExpenses.reduce((sum, e) => sum + e.amount, 0);

            document.getElementById('totalBudget').textContent = `¥${total.toLocaleString()}`;

            if (allExpenses.length === 0) {
                container.innerHTML = `<div class="empty-state">費用の記録がありません</div>`;
            } else {
                container.innerHTML = allExpenses.map(item => `
                    <li class="list-item">
                        <div>
                            <div style="font-weight:600;">${escapeHtml(item.name)}</div>
                            <div style="font-size:0.8rem; color:var(--text-muted);">${item.category}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <span style="font-weight:700;">¥${item.amount.toLocaleString()}</span>
                            ${item.type === 'direct' ? `
                                <button class="btn btn-sm btn-danger-light" onclick="deleteDirectExpense(${item.id})">
                                    <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
                                </button>
                            ` : `<span style="font-size:0.75rem; color:var(--text-muted);">(スケジュール連動)</span>`}
                        </div>
                    </li>
                `).join('');
            }

            if (document.getElementById('expenseViewChart').style.display !== 'none') {
                drawExpenseChart();
            }

            lucide.createIcons();
        }

        // Draw Canvas Pie Chart
        function drawExpenseChart() {
            const canvas = document.getElementById('expenseCanvas');
            const ctx = canvas.getContext('2d');
            const legendContainer = document.getElementById('chartLegend');

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            legendContainer.innerHTML = '';

            const allExpenses = getAllExpenses();

            if (allExpenses.length === 0) {
                legendContainer.innerHTML = `<div class="empty-state">データがありません</div>`;
                return;
            }

            const totalsByCategory = {};
            let grandTotal = 0;

            allExpenses.forEach(e => {
                totalsByCategory[e.category] = (totalsByCategory[e.category] || 0) + e.amount;
                grandTotal += e.amount;
            });

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 10;

            let startAngle = -0.5 * Math.PI;

            Object.keys(totalsByCategory).forEach(cat => {
                const amount = totalsByCategory[cat];
                const sliceAngle = (amount / grandTotal) * 2 * Math.PI;
                const color = categoryColors[cat] || "#94a3b8";

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();

                startAngle += sliceAngle;

                const percent = Math.round((amount / grandTotal) * 100);
                const legendItem = document.createElement('div');
                legendItem.className = 'legend-item';
                legendItem.innerHTML = `
                    <div class="legend-color" style="background-color: ${color}"></div>
                    <span>${cat}: ¥${amount.toLocaleString()} (${percent}%)</span>
                `;
                legendContainer.appendChild(legendItem);
            });
        }

        // Persistence (LocalStorage)
        function saveAllTrips() {
            localStorage.setItem('all_trip_planner_data', JSON.stringify(trips));
        }

        function loadAllTrips() {
            const saved = localStorage.getItem('all_trip_planner_data');
            if (saved) {
                try {
                    trips = JSON.parse(saved);
                } catch(e) {
                    console.error("Failed to load trips", e);
                    trips = [];
                }
            } else {
                // Initial sample trip if empty
                trips = [{
                    id: 1,
                    tripTitle: "北海道サイクリング＆グルメ旅",
                    startDate: "2026-10-10",
                    endDate: "2026-10-13",
                    daysCount: 4,
                    schedules: [
                        { id: 1, day: 1, time: "09:00", title: "羽田空港 出発", memo: "ANA553便", cost: 16000, category: "交通費" },
                        { id: 2, day: 1, time: "10:35", title: "新千歳空港 到着", memo: "レンタカーの受付へ", cost: 8000, category: "交通費" },
                        { id: 3, day: 1, time: "12:30", title: "札幌市内で味噌ラーメン", memo: "有名店へ立ち寄り", cost: 1000, category: "食費" }
                    ],
                    packings: [
                        { id: 1, name: "着替え", count: 3, checked: false },
                        { id: 2, name: "スマホ充電器", count: 1, checked: true },
                        { id: 3, name: "常備薬", count: 1, checked: false }
                    ],
                    directExpenses: [
                        { id: 101, name: "ホテル予約 (3泊)", amount: 24000, category: "宿泊費" }
                    ]
                }];
                saveAllTrips();
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
